services:
  - type: web
    name: suhail-v2
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PRODUCTION
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: suhail-db
          property: connectionString

databases:
  - name: suhail-db
    databaseName: suhail
    user: suhail
    plan: 0.1c-256mb
